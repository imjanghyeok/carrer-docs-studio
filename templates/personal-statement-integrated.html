<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><title>통합형 양식</title><style>
@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;color:#263c33;font:14px/1.75 "Apple SD Gothic Neo","Noto Sans KR",sans-serif}.page{width:210mm;min-height:297mm;padding:18mm;background:white;break-after:page}h1{font-size:32px;line-height:1.3;margin:0 0 12px}h2{font-size:21px;margin:24px 0 12px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0}article{padding:16px;border:1px solid #d7e2da;border-radius:8px;margin:14px 0;break-inside:avoid}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.timeline{border-left:3px solid #50856a;padding-left:20px}.timeline article{border:0;border-bottom:1px solid #d7e2da;border-radius:0}.muted,footer{color:#607368;font-size:12px}ul{padding-left:20px}footer{margin-top:24px}
</style></head><body><section class="page"><header data-section="기본 정보"><h1>이름을 입력하세요</h1><p class="muted">지원 직무 · 연락처와 링크는 직접 추가하세요.</p></header><h2>소개와 경험을 함께</h2><article data-section="소개"><h3>나를 소개합니다</h3><p>관심, 도전하는 방식, 깊이 파고드는 주제를 적으세요.</p></article><article data-section="대표 경험"><h3>대표 경험</h3><p>기간 · 팀 · 담당 범위</p><p>나의 성향을 보여주는 행동과 확인한 결과를 적으세요.</p></article><article data-section="학습과 활동"><h3>학습 · 활동</h3><p>기간 · 활동 이름 · 인원 · 읽은 책이나 다룬 주제</p><p>배운 것을 실제 작업에 적용했다면 연결 과정을 설명하세요.</p></article><footer>작성 안내를 자신의 경험으로 바꾼 뒤 이 안내 문구는 제외하세요.</footer></section></body></html>
